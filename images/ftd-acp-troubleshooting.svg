<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="580" viewBox="0 0 1420 580"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="55" font-family="Arial" font-size="30" font-weight="bold">ACP Troubleshooting Decision Path</text><g fill="#f4f6f8" stroke="#333" stroke-width="2"><rect x="80" y="130" width="230" height="90" rx="12"/><rect x="390" y="130" width="230" height="90" rx="12"/><rect x="700" y="130" width="230" height="90" rx="12"/><rect x="1010" y="130" width="230" height="90" rx="12"/><rect x="220" y="360" width="250" height="100" rx="12"/><rect x="590" y="360" width="250" height="100" rx="12"/><rect x="960" y="360" width="250" height="100" rx="12"/></g><g font-family="Arial" font-size="18" text-anchor="middle"><text x="195" y="165">Symptom:</text><text x="195" y="190">traffic unexpectedly blocked</text><text x="505" y="165">packet-tracer</text><text x="505" y="190">route / NAT / CSM_FW_ACL_</text><text x="815" y="165">Real packet capture</text><text x="815" y="190">trace detail</text><text x="1125" y="165">Connection / event logs</text><text x="1125" y="190">matched rule &amp; reason</text><text x="345" y="395">If LINA deny:</text><text x="345" y="420">check zones, networks, ports,</text><text x="345" y="445">NAT/real addresses, rule order</text><text x="715" y="395">If sent to Snort:</text><text x="715" y="420">check app/URL/identity,</text><text x="715" y="445">decryption, intrusion/file</text><text x="1085" y="395">If policy looks correct:</text><text x="1085" y="420">check asp-drop, MPF, routing,</text><text x="1085" y="445">return path, deployment</text></g><g stroke="#333" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M310 175H390"/><path d="M620 175H700"/><path d="M930 175H1010"/><path d="M505 220L345 360"/><path d="M815 220L715 360"/><path d="M1125 220L1085 360"/></g></svg>