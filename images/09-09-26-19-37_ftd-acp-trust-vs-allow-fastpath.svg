<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="50" y="55" font-family="Arial" font-size="30" font-weight="bold">FTD ACP Trust vs Allow vs Prefilter Fastpath</text><g fill="#f4f6f8" stroke="#333" stroke-width="2"><rect x="60" y="150" width="180" height="80" rx="12"/><rect x="320" y="150" width="180" height="80" rx="12"/><rect x="270" y="350" width="280" height="110" rx="12"/><rect x="600" y="150" width="320" height="90" rx="12"/><rect x="1010" y="150" width="200" height="80" rx="12"/><rect x="900" y="350" width="300" height="110" rx="12"/><rect x="1260" y="350" width="280" height="110" rx="12"/><rect x="1040" y="570" width="180" height="80" rx="12"/></g><g font-family="Arial" font-size="18" text-anchor="middle"><text x="150" y="198">Ingress traffic</text><text x="410" y="198">Prefilter</text><text x="410" y="382">Fastpath</text><text x="410" y="408">bypass ACP / identity /</text><text x="410" y="434">rate limiting / Snort</text><text x="760" y="188">Decryption / Security Intelligence / Identity</text><text x="760" y="214">(as configured before ACP)</text><text x="1110" y="198">ACP rule match</text><text x="1050" y="382">Trust</text><text x="1050" y="408">permit, but NO further file / intrusion</text><text x="1050" y="434">/ network discovery</text><text x="1400" y="382">Allow</text><text x="1400" y="408">permit + optional File Policy /</text><text x="1400" y="434">Intrusion Policy / discovery</text><text x="1130" y="618">Forward</text></g><g stroke="#333" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M240 190H320"/><path d="M410 230V350"/><path d="M500 190H600"/><path d="M920 195H1010"/><path d="M1110 230L1050 350"/><path d="M1110 230L1400 350"/><path d="M410 460L1040 610"/><path d="M1050 460L1110 570"/><path d="M1400 460L1200 570"/></g><g font-family="Arial" font-size="16"><text x="430" y="292">Fastpath</text><text x="535" y="181">Analyze</text><text x="1025" y="298">Trust</text><text x="1265" y="285">Allow</text><text x="1295" y="526">after optional inspection</text></g></svg>