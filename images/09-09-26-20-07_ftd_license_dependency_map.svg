<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:25px;font-weight:700}.b{font-size:17px}.box{fill:#fff;stroke:#222;stroke-width:2;rx:12}.dash{fill:#fff;stroke:#555;stroke-width:2;stroke-dasharray:8 6;rx:12}.arr{stroke:#333;stroke-width:3;fill:none;marker-end:url(#a)}</style><text x="750" y="70" text-anchor="middle" class="h">Cisco Secure Firewall Threat Defense — License Dependency Map</text><rect class="box" x="500" y="120" width="500" height="130"/><text x="750" y="152" text-anchor="middle" class="b" font-weight="700"><tspan x="750">ESSENTIALS — Perpetual / Required</tspan><tspan x="750" dy="24">Routing • Switching • NAT • HA • Clustering*</tspan><tspan x="750" dy="24">Application &amp; user control • VDB/GeoDB updates</tspan><tspan x="750" dy="24">(*where platform supports it)</tspan></text><rect class="box" x="180" y="340" width="300" height="120"/><text x="330" y="373" text-anchor="middle" class="b"><tspan x="330">IPS — Term</tspan><tspan x="330" dy="24">Intrusion policies</tspan><tspan x="330" dy="24">Security Intelligence</tspan><tspan x="330" dy="24">File control foundation</tspan></text><rect class="box" x="600" y="340" width="300" height="120"/><text x="750" y="373" text-anchor="middle" class="b"><tspan x="750">MALWARE DEFENSE — Term</tspan><tspan x="750" dy="24">Malware inspection / disposition</tspan><tspan x="750" dy="24">File policy malware actions</tspan><tspan x="750" dy="24">Requires IPS</tspan></text><rect class="box" x="1020" y="330" width="330" height="140"/><text x="1185" y="360" text-anchor="middle" class="b"><tspan x="1185">URL FILTERING — Term</tspan><tspan x="1185" dy="23">Category + reputation filtering</tspan><tspan x="1185" dy="23">DNS request filtering</tspan><tspan x="1185" dy="23">Individual URL matching: no URL license</tspan><tspan x="1185" dy="23">Licensed feature use requires IPS</tspan></text><rect class="box" x="360" y="570" width="330" height="130"/><text x="525" y="602" text-anchor="middle" class="b"><tspan x="525">CISCO SECURE CLIENT</tspan><tspan x="525" dy="24">Advantage / Premier / VPN Only</tspan><tspan x="525" dy="24">Remote-access VPN entitlement</tspan><tspan x="525" dy="24">Separate Secure Client licensing model</tspan></text><rect class="box" x="810" y="570" width="330" height="130"/><text x="975" y="602" text-anchor="middle" class="b"><tspan x="975">CARRIER — Term</tspan><tspan x="975" dy="24">Diameter • GTP/GPRS • SCTP • M3UA</tspan><tspan x="975" dy="24">Mobile-network protocol inspection</tspan><tspan x="975" dy="24">Supported platforms only</tspan></text><rect class="dash" x="330" y="750" width="840" height="60"/><text x="750" y="785" text-anchor="middle" class="b">T = IPS/Threat • TM = IPS + Malware • TC = IPS + URL • TMC = IPS + Malware + URL</text><path class="arr" d="M750 250V290H330V340"/><path class="arr" d="M480 400H600"/><text x="540" y="390" text-anchor="middle" class="b">prerequisite</text><path class="arr" d="M330 460V510H1185V470"/><text x="760" y="500" text-anchor="middle" class="b">IPS prerequisite</text><path class="arr" d="M750 250V530H525V570"/><path class="arr" d="M750 250V530H975V570"/></svg>